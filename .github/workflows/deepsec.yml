name: DeepSec PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Same-repo PRs only: forks cannot access AI_GATEWAY_API_KEY secret
# and we must not grant pull-requests:write to jobs running fork code.
concurrency:
  group: deepsec-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Changes
    runs-on: ubuntu-latest
    # Only run for PRs from the same repository (not forks)
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0

      - name: Setup Node.js
        uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.0.4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: .deepsec/pnpm-lock.yaml

      - name: Install DeepSec dependencies
        run: cd .deepsec && pnpm install --frozen-lockfile

      - name: Run DeepSec analysis
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          BASE_REF: ${{ github.event.pull_request.base.sha }}
          CLAUDE_CODE_EXECUTABLE: "true"
        run: |
          cd .deepsec
          pnpm exec deepsec review-changes \
            --base "$BASE_REF" \
            --comment-out review-comment.md

      - name: Upload review comment
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: deepsec-review-comment
          path: .deepsec/review-comment.md
          if-no-files-found: warn

  comment:
    name: Post Review Comment
    runs-on: ubuntu-latest
    needs: analyze
    # Only run for PRs from the same repository
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download review comment
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: deepsec-review-comment

      - name: Post comment to PR
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const commentPath = 'review-comment.md';
            
            if (!fs.existsSync(commentPath)) {
              console.log('No review comment found, skipping.');
              return;
            }
            
            const body = fs.readFileSync(commentPath, 'utf8');
            
            if (!body.trim()) {
              console.log('Review comment is empty, skipping.');
              return;
            }
            
            // Find existing DeepSec comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('<!-- deepsec-review -->')
            );
            
            const commentBody = `<!-- deepsec-review -->\n${body}`;
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody,
              });
              console.log('Updated existing DeepSec comment.');
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody,
              });
              console.log('Created new DeepSec comment.');
            }
