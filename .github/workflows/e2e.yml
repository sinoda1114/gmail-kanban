# Clerk 認証付き Playwright E2E（gmail-kanban 固有）
#
# 標準 CI（ci-standard）の e2e ジョブは Secrets をプロセス env に渡さないため、
# Clerk Testing Token が必要な間は本ワークフローで E2E を回す。
# ci-standard 側で optional secrets マップが入ったら `.github/ci-skip-e2e` を削除し、
# 標準の `ci / e2e` に寄せて本ファイルを退役できる（sinoda1114/ci-standard#2）。
name: E2E

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Clerk Secrets の有無を確認
        run: |
          if [ -z "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" ] || [ -z "$CLERK_SECRET_KEY" ]; then
            echo "::error::GitHub Actions Secrets に NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY / CLERK_SECRET_KEY が未設定です。"
            echo "ローカルで scripts/set-github-e2e-secrets.sh を実行するか、Repo Settings → Secrets に登録してください。"
            exit 1
          fi
          case "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" in pk_*) ;; *)
            echo "::error::NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY が pk_ で始まっていません"; exit 1 ;;
          esac
          case "$CLERK_SECRET_KEY" in sk_*) ;; *)
            echo "::error::CLERK_SECRET_KEY が sk_ で始まっていません"; exit 1 ;;
          esac

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm

      - name: CI用環境変数を読み込み (.github/ci.env)
        run: |
          if [ -f .github/ci.env ]; then
            grep -v '^\s*#' .github/ci.env >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.strict-dep-builds=false

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
