# Dependabot 設定
#
# npm 依存の更新 PR を毎週自動作成する。
# 方針: lockfile（pnpm-lock.yaml）はコミット対象であり、Dependabot は
#       それを前提に更新 PR を出す。CI（.github/workflows/ci.yml）が
#       型・lint・テスト・ビルド・audit を検証するゲートとして働く。
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    # 1 度に開く更新 PR の上限（レビュー負荷の抑制）。
    open-pull-requests-limit: 10
    # PR タイトルに付与する接頭辞（コミット履歴の見通し向上）。
    commit-message:
      prefix: "deps"

  # .agents スキルテンプレートの package.json は Dependabot 対象外（ノイズ抑制）。
  - package-ecosystem: npm
    directory: "/.agents/skills/clerk-astro-patterns/templates/astro-basic-auth"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: npm
    directory: "/.agents/skills/clerk-chrome-extension-patterns/templates/chrome-ext-basic-auth"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: npm
    directory: "/.agents/skills/clerk-nextjs-patterns/templates/nextjs-basic-auth"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: npm
    directory: "/.agents/skills/clerk-nuxt-patterns/templates/nuxt-basic-auth"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: npm
    directory: "/.agents/skills/clerk-react-patterns/templates/react-basic-auth"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: npm
    directory: "/.agents/skills/clerk-react-router-patterns/templates/react-router-basic-auth"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: npm
    directory: "/.agents/skills/clerk-tanstack-patterns/templates/tanstack-basic-auth"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: npm
    directory: "/.agents/skills/clerk-vue-patterns/templates/vue-basic-auth"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
